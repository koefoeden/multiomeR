on:
  push:
    branches: [main]
    paths:
      - .github/workflows/algorithm-validation.yaml
      - pixi.toml
      - pixi.lock
      - scripts/install_r_github_packages.R
      - scripts/validate_algorithm_deviations.R
      - scripts/validate_scoring_parity.R
      - R/processing_GEX_helpers.R
      - R/processing_multimodal_helpers.R
      - R/gchromvar_SCAVENGE_helpers.R
  pull_request:
    paths:
      - .github/workflows/algorithm-validation.yaml
      - pixi.toml
      - pixi.lock
      - scripts/install_r_github_packages.R
      - scripts/validate_algorithm_deviations.R
      - scripts/validate_scoring_parity.R
      - R/processing_GEX_helpers.R
      - R/processing_multimodal_helpers.R
      - R/gchromvar_SCAVENGE_helpers.R
  workflow_dispatch:

name: algorithm-validation.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Install pinned source packages
        run: pixi run install-source-packages

      - name: Validate algorithm implementations
        run: pixi run test-algorithm-validation
