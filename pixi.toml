r-purrr = ">=1.2.2,<2"
"r-r.utils" = ">=2.13.0,<3"
r-ragg = ">=1.5.2,<2"
r-rcolorbrewer = ">=1.1_3,<2"
r-rcurl = ">=1.98_1.18,<2"
r-readr = ">=2.2.0,<3"
r-readxl = ">=1.4.5,<2"
r-reticulate = ">=1.46.0,<2"
r-rlang = ">=1.2.0,<2"
r-rnomni = ">=1.0.1.2,<2"
r-rprojroot = ">=2.1.1,<3"
r-rsqlite = ">=2.4.6,<3"
r-scales = ">=1.4.0,<2"
