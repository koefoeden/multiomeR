# Do not enable bioconda r-signac here yet: bioconda currently provides Signac 1.17.x,
# while the target needs the v2 branch for ChromatinAssay5 / GRangesAssay support.
# Install through DESCRIPTION Remotes / remotes until Signac v2 is published on conda-forge or bioconda.
# r-signac = ">=2.0.0,<3"
r-stringr = ">=1.6.0,<2"
r-tarchetypes = ">=0.14.1,<0.15"
r-targets = ">=1.12.0,<2"
r-tibble = ">=3.3.1,<4"
r-tidyr = ">=1.3.2,<2"
r-tidyselect = ">=1.2.1,<2"
r-tidytext = ">=0.4.3,<0.5"
r-viridis = ">=0.6.5,<0.7"
r-visnetwork = ">=2.1.4,<3"
r-withr = ">=3.0.2,<4"
r-xml = ">=3.99_0.22,<4"
r-yaml = ">=2.3.12,<3"
r-qs2 = ">=0.2.0,<0.3" # used indirectly by targets for saving/loading target objects
bioconductor-motifmatchr = ">=1.32.0,<2"
r-autometric = ">=0.1.2,<0.2" # used indirectly by targets
libblas = { version = "*", build = "*openblas" }
liblapack = { version = "*", build = "*openblas" }
libcblas = { version = "*", build = "*openblas" }
openblas = ">=0.3.32,<0.4"
# r-rcpparmadillo = ">=15.2.6_1,<16" # no native RcppArmadillo source in this repo
r-arrow = ">=24.0.0,<25"
r-remotes = ">=2.5.0,<3" # install helper for GitHub-only R dependencies such as Signac v2
r-fastmatch = ">=1.1_8,<2" # indirect dependency of Signac v2
r-rcpproll = ">=0.3.2,<0.4" # indirect dependency of Signac v2
bioconductor-sparsematrixstats = ">=1.22.0,<2" # indirect dependency of Signac v2

