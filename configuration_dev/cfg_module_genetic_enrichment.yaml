mixed_human_31x:
  # Exploratory trait panel for the observed cell types across GEX, ATAC and WNN. See
  # configuration_dev/mixed_human_31x_GWAS_selection.tsv for rationale, power and
  # credible-set coverage.
  # Cell-type links are hypotheses, not guaranteed enrichment or exclusive origins.
  # Selection metadata is from Open Targets 26.03, checked 2026-09-08. Counts are
  # available credible-set records before pipeline variant/peak filtering, not
  # independent loci. Study-index sample/case counts can omit cohorts; zero cases
  # can mean unreported/not applicable. Correlated traits are not independent tests.
  # Studies with fewer than 20 effective peaks in this aggregation, (sum w)^2 / sum w^2 of their
  # variant-weighted peaks, were left out of the first selection.
  # Every study has genome-wide summary statistics on the GWAS Catalog FTP, so that S-LDSC tests
  # all of them. Studies without them were replaced on 2026-11-06 by the same trait's study with
  # harmonised summary statistics and the largest European-ancestry sample, the ancestry of the
  # LD reference, whatever their credible sets: Schizophrenia_Pedersen2023 and
  # ColorectalCancer_Verma2024 have fewer than 20 effective peaks. Multiple sclerosis and lupus
  # were dropped: no such study reached a total S-LDSC heritability z-score of 7, which every
  # kept study does.
  genetic_enrichment_GWAS_studies:
    # B;T;NK: Broad lymphocyte abundance proxy; does not distinguish NK from B or T cells.
    LymphocyteCount_Vuckovic2020:
      Category: blood_cell_counts
      sourceId: GCST90002388
    # Mono: Direct monocyte abundance phenotype.
    MonocyteCount_Vuckovic2020:
      Category: blood_cell_counts
      sourceId: GCST90002393
    # Colonocyte;T;B;Mono;Goblet: Epithelial barrier and immune disease; shared cellular mechanisms.
    UlcerativeColitis_Liu2023:
      Category: immune_gut
      sourceId: GCST90446794
    # Inhibitory_neuron: Broad energy-balance phenotype; not a negative control in a brain-containing atlas.
    BMI_Verma2024:
      Category: neuronal_metabolic
      sourceId: GCST90475159
    # Inhibitory_neuron: Broad neuronal comparator with social and indirect genetic effects; not cell-type specific or a negative control.
    EducationalAttainment_Loh2018:
      Category: neuronal_complex
      sourceId: GCST90029013
    # Airway_secretory;T: Airway epithelial and immune mechanisms; selected for extensive SuSiE-inf coverage.
    Asthma_Zhou2022_EUR:
      Category: lung_immune
      sourceId: GCST90399686
    # Airway_secretory;Alveolar_type_2;Smooth_muscle: Broad pulmonary physiology; lung-function GWAS implicates epithelial and smooth-muscle biology.
    FEV1_Shrine2023:
      Category: lung_function
      sourceId: GCST90244092
    # Airway_secretory;Smooth_muscle: Airflow obstruction physiology; complementary to FEV1.
    FEV1FVC_Shrine2023:
      Category: lung_function
      sourceId: GCST90244094
    # Microglia: Strong microglial and innate-immune susceptibility evidence; also involves other brain cells.
    Alzheimer_Bellenguez2022:
      Category: neurodegeneration
      sourceId: GCST90027158
    # Inhibitory_neuron;Granule_neuron: GWAS enrichment in excitatory and inhibitory neurons; granule neurons are a broader excitatory-lineage comparator.
    Schizophrenia_Pedersen2023:
      Category: neuronal_disease
      sourceId: GCST90275158
    # Inhibitory_neuron: Neuronal excitability disease; not specific to inhibitory neurons.
    GeneralizedEpilepsy_ILAE2023:
      Category: neuronal_disease
      sourceId: GCST90271609
    # T;B;Mono;Fibroblast: Immune susceptibility and synovial fibroblast disease biology; not fibroblast-specific inherited risk.
    RheumatoidArthritis_Ishigaki2022:
      Category: immune_disease
      sourceId: GCST90132222
    # Cardiomyocyte: Cardiac electrophysiology; interpretation depends on atrial versus ventricular identity.
    AtrialFibrillation_Yuan2025_EUR:
      Category: cardiac
      sourceId: GCST90624412
    # Colonocyte: Colorectal epithelial neoplasia; mature colonocytes are a lineage proxy, not a proven exclusive initiating cell.
    ColorectalCancer_Verma2024:
      Category: colon_epithelial
      sourceId: GCST90475566
    # Endothelial;Smooth_muscle;Mono: Atherosclerosis implicates vascular and immune cells; extensive SuSiE-inf coverage.
    CAD_Aragam2022_EUR:
      Category: vascular
      sourceId: GCST90132314
    # Smooth_muscle;Endothelial;Pericyte: Vascular tone and pressure; pericytes are a broader mural-cell proxy and renal mechanisms also contribute.
    SystolicBP_Keaton2024:
      Category: vascular
      sourceId: GCST90310294
    # Smooth_muscle;Endothelial;Pericyte: Complementary blood-pressure phenotype; not independent of systolic BP.
    DiastolicBP_Keaton2024:
      Category: vascular
      sourceId: GCST90310295
    # Fibroblast: Fibroproliferative disease with myofibroblast biology; tissue-specific comparator.
    Dupuytren_Riesmeijer2024:
      Category: fibroblast
      sourceId: GCST90301252
    # Hepatocyte: Hepatic lipoprotein metabolism; additional tissues contribute.
    LDL_Graham2021:
      Category: hepatic_lipids
      sourceId: GCST90239655
    # Hepatocyte: Complementary lipid transport phenotype; correlated with other lipid traits.
    HDL_Graham2021:
      Category: hepatic_lipids
      sourceId: GCST90239649
    # Hepatocyte: Hepatic triglyceride and lipoprotein metabolism; additional tissues contribute.
    Triglycerides_Graham2021:
      Category: hepatic_lipids
      sourceId: GCST90239661
    # Hepatocyte: Liver enzyme phenotype related to hepatocyte function and injury.
    ALT_Karczewski2025:
      Category: liver
      sourceId: GCST90691566
    # Pancreatic_beta;Pancreatic_alpha: Strong beta-cell evidence with alpha-cell regulatory involvement; not alpha-specific and includes systemic insulin resistance.
    T2D_Verma2024:
      Category: pancreatic_endocrine
      sourceId: GCST90475667
    # Pancreatic_beta;Pancreatic_alpha;Hepatocyte: Non-fasting glucose; beta-cell and hepatic glucose regulation, with insulin action in other tissues.
    RandomGlucose_Lagou2023_EUR:
      Category: pancreatic_endocrine
      sourceId: GCST90271557
