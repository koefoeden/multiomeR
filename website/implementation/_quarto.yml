project:
  type: book
  output-dir: ../../docs/implementation

book:
  title: "multiomeR Implementation"
  site-url: https://koefoeden.github.io/multiomeR/implementation/
  repo-url: https://github.com/koefoeden/multiomeR
  repo-subdir: website/implementation
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    collapse-level: 2
  chapters:
    - href: index.md
      text: Introduction
    - part: "Orientation"
      chapters:
        - href: graph_methodology.md
          text: Reading the graph views
        - href: implementation_conventions.md
          text: Implementation conventions
    - part: "Primary module"
      chapters:
        - href: methods_preprocessing_and_QC.md
          text: Preprocessing and nucleus QC
        - href: methods_GEX_ATAC_and_WNN.md
          text: GEX, ATAC, batch correction and WNN
        - href: methods_annotation_and_motifs.md
          text: Cell-type annotation and motif accessibility
    - part: "Optional modules"
      chapters:
        - href: methods_peak_gene_correlation.md
          text: Peak–gene correlation
        - href: methods_differential_analyses.md
          text: Differential analyses
        - href: methods_genetic_enrichment.md
          text: Genetic enrichment
    - part: "Validation"
      chapters:
        - href: algorithm_validation.md
          text: Algorithmic implementations, deviations and validation

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: ../styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: true
