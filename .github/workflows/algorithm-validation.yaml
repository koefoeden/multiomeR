on:
  push:
    branches: [main]
    paths:
      - .github/workflows/algorithm-validation.yaml
      - pixi.toml
      - pixi.lock
      - scripts/install_r_github_packages.R
      - tests/**
      - R/**
      - packages/multiomeRCore/R/**
      - src/**
      - crew_controllers.R
  pull_request:
    paths:
      - .github/workflows/algorithm-validation.yaml
      - pixi.toml
      - pixi.lock
      - scripts/install_r_github_packages.R
      - tests/**
      - R/**
      - packages/multiomeRCore/R/**
      - src/**
      - crew_controllers.R
  workflow_dispatch:

name: algorithm-validation.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Install pinned GitHub R packages
        run: pixi run --use-environment-activation-cache install-r-github-packages

      - name: Run test suite
        run: pixi run --use-environment-activation-cache test
