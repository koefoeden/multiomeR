graph_stem: blood_human_aggregation_d093e868b61c1467
graph_build:
  pipeline_name: blood_human_aggregation
  target_graph_match: blood_human$
output_stem: blood_human_subgroup_analysis
slug: subgroup_analysis
title: Subgroup Analysis
scope_patterns:
- metadata_w_cell_types_tibble\.WNN\.blood_human$
- subgroups
- marker_volcano_plots\.subgroups
- categorical\.UMAPs\.subgroups
- continuous\.UMAPs\.subgroups
nodes:
- id: WNNMetadata
  label: Integrated WNN metadata
  representative: metadata_w_cell_types_tibble.WNN
  class: regular_input
  target_patterns:
  - ^metadata_w_cell_types_tibble\.WNN\.blood_human$
- id: SubgroupDefinitions
  label: Subgroup definitions
  representative: subgroups_to_process_vec
  class: regular_input
  target_patterns:
  - ^subgroups_to_process_vec\.blood_human$
- id: SubgroupMetadata
  label: Filtered subgroup metadata
  representative: metadata_tibble.subgroups
  class: intermediate_object
  target_patterns:
  - ^metadata_tibble\.subgroups\.blood_human$
  - ^metadata_w_clusters_tibble_filtered\.subgroups\.blood_human$
- id: SubgroupGEX
  label: Subgroup GEX embedding
  representative: PCA/Harmony.GEX.subgroups
  class: intermediate_object
  target_patterns:
  - ^PCA_BPCells\.GEX\.subgroups\.blood_human$
  - ^harmony_embeddings_matrix\.GEX\.subgroups\.blood_human$
  - ^PCA_clusters\.GEX\.subgroups\.blood_human$
  - ^UMAP_embeddings_tibble\.GEX\.subgroups\.blood_human$
- id: SubgroupATAC
  label: Subgroup ATAC embedding
  representative: LSI/Harmony.ATAC.subgroups
  class: intermediate_object
  target_patterns:
  - ^LSI_BPCells\.ATAC\.subgroups\.blood_human$
  - ^harmony_embeddings_matrix\.ATAC\.subgroups\.blood_human$
  - ^LSI_clusters\.ATAC\.subgroups\.blood_human$
  - ^UMAP_embeddings_tibble\.ATAC\.subgroups\.blood_human$
- id: SubgroupWNN
  label: Subgroup WNN embedding
  representative: WNN_results.subgroups
  class: intermediate_object
  target_patterns:
  - ^embedding_matrices\.subgroups\.blood_human$
  - ^WNN_results\.subgroups\.blood_human$
  - ^clusters_tibble\.WNN\.subgroups\.blood_human$
  - ^UMAP_embeddings_tibble\.WNN\.subgroups\.blood_human$
  - ^metadata_w_clusters_tibble\.subgroups\.blood_human$
- id: SubgroupOutputs
  label: Subgroup markers and plots
  representative: subgroup UMAPs and markers
  class: regular_output
  target_patterns:
  - ^(categorical|continuous)\.UMAPs\.subgroups\.(GEX|ATAC|WNN)\.blood_human$
  - ^marker_tibbles\.subgroups\.blood_human$
  - ^marker_volcano_plots\.subgroups\.(GEX|ATAC|WNN)\.blood_human$
edges:
- from: WNNMetadata
  to: SubgroupDefinitions
  label: select cell groups
  style: -->
- from: SubgroupDefinitions
  to: SubgroupMetadata
  label: filter cells
  style: -->
- from: SubgroupMetadata
  to: SubgroupGEX
  label: rerun GEX embedding
  style: -->
- from: SubgroupMetadata
  to: SubgroupATAC
  label: rerun ATAC embedding
  style: -->
- from: SubgroupGEX
  to: SubgroupWNN
  label: combine subgroup embeddings
  style: -->
- from: SubgroupATAC
  to: SubgroupWNN
  label: combine subgroup embeddings
  style: -->
- from: SubgroupWNN
  to: SubgroupOutputs
  label: visualize + markers
  style: -->
