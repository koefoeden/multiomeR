      Cholangiocytes: [CFTR, PKHD1, BICC1]
      Endothelial: [FBXL7, MEIS2, ST6GALNAC3]
      Myeloid: [FMNL2, ZEB2, MSR1, PLXDC2]
      Lymphoid: [BCL11B, PARP8, PYHIN1]
