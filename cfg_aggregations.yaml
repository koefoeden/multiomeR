      - vireo_max_prob_singlet
      - age
      - INR
      - ALT
      - AST
      - ALP
      - bilirubin
      - HBA1C
      - HDL
      - LDL
      - VLDL
      - CPR
      - steatosis_score
      - lobular_inflammation_score
      - ballooning_score
      - NAS_score
      - fatmassindex
    aggregation_roadmap_EDACC_names: Adult_Liver
    aggregation_tar_make_skip_regex_patterns:
      - ^ATAC_(tracks|insertions|million_reads|coverage|bigBeds) # ---------- skips ATAC tracks
      - ^GEX_3D_UMAP_ # ---------- skips GEX 3D UMAPs
      - ^subgroups_ # ---------- skips subgroup analysis
