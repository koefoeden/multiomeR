project:
  type: book
  output-dir: ../docs

book:
  title: "multiomeR Manual"
  site-url: https://koefoeden.github.io/multiomeR/
  repo-url: https://github.com/koefoeden/multiomeR
  repo-subdir: website
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    collapse-level: 2
  chapters:
    - part: "Overview"
      chapters:
        - index.qmd
        - intro_manual_usage.qmd
    - part: "Quickstart: Public two-reaction demo"
      chapters:
        - demo_installation.qmd
        - demo_running.qmd
        - demo_outputs.qmd
    - part: "Configure and run your own data"
      chapters:
        - main_overview.qmd
        - main_inputs.qmd
        - main_running.qmd
    - part: "Optional modules"
      chapters:
        - downstream_differential_analyses.qmd
        - downstream_genetic_enrichment.qmd
    - part: "Output gallery"
      chapters:
        - gallery_main.qmd
        - gallery_differential_analyses.qmd
        - gallery_genetic_enrichment.qmd
    - part: "Operation and scaling"
      chapters:
        - performance_overview.qmd
        - performance_distributed_computing.qmd
        - troubleshooting.qmd
    - part: "Reference"
      chapters:
        - href: implementation/
          text: Implementation book
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: true
