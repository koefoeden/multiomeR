# FLINC configuration that produced freeze 2.24_w_Seurat_SCT. PROVENANCE.md lists what differs from the run.
default:
  mandatory:
    genetic_enrichment_open_targets_studies: NULL # Named Open Targets study mappings keyed by GWAS_ID. Each mapping must include Category and studyId. variant_weighting_mode is optional.
  optional:
    genetic_enrichment_psbulk_GWAS_chromVAR_models: # Model specification list for pseudobulk GWAS chromVAR differential activity.
      all_cell_types_one_vs_rest:
        cell_type_subset: NULL
        design_matrix_func_name: NULL
        formula: ~ 0 + cluster + donor_id
        random_effect: NULL
        contrast_specs_vec: NULL
        contrast_functions:
          cell_type_vs_rest: get_cluster_one_vs_rest_contrast_vec_list
    genetic_enrichment_posterior_probability_cutoff: 0.001 # posteriorProbability cutoff for gchromVAR. NULL applies no cutoff.
    genetic_enrichment_posterior_probability_weighting_function_name: NULL # Function expression used to weight Open Targets posteriorProbability values. NULL skips weighting.
    genetic_enrichment_compartment_patterns: NULL # Named regex patterns used to group cell types or contrasts into plot compartments.
    genetic_enrichment_SCAVENGE_permutation_times: 100 # Degree-matched random-walk permutations per GWAS/graph branch.
    genetic_enrichment_SCAVENGE_restart_prob: 0.05 # Random-walk restart probability.
    genetic_enrichment_SCAVENGE_seed_percent: 0.05 # Maximum fraction of cells used as random-walk seeds.
    genetic_enrichment_psbulk_GWAS_chromVAR_min_ATAC_counts: 5000 # Minimum pseudobulk ATAC counts per cluster-donor sample for GWAS chromVAR differential activity.
    genetic_enrichment_psbulk_GWAS_gene_chromVAR_GWAS_IDs: NULL # GWAS_IDs to run in the gene-level pseudobulk GWAS chromVAR extension. NULL skips the extension.
    genetic_enrichment_extended_donor_id_metadata_tsv: NULL # TSV with donor-level metadata of interest. If NULL, inherits aggregation_donor_id_metadata_tsv.

