project:
  type: book
  output-dir: ../docs

book:
  title: "multiomeR Manual"
  site-url: https://koefoeden.github.io/multiomeR/
  repo-url: https://github.com/koefoeden/multiomeR
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    collapse-level: 2
  chapters:
    - part: "Introduction"
      chapters:
      - index.qmd
      - manual_usage.qmd
    - part: "Background and design philosophy"
      chapters:
        - philosophy.qmd
    - part: "Example data: Quick, full run-through"
      chapters:
        - installation.qmd
        - running_demo.qmd
        - outputs_demo.qmd
    - part: "Your own data: The main pipeline"
      chapters:
        - main_pipeline_overview.qmd
        - inputs_main.qmd
        - running_workflow.qmd
    - part: "Your own data: Downstream modules"
      chapters:
        - differential_analyses_walkthrough.qmd
        - genetic_enrichment_walkthrough.qmd
    - part: "Performance"
      chapters:
        - performance_overview.qmd
        - distributed_computing.qmd
    - part: "Output gallery"
      chapters:
        - output_gallery_main.qmd
        - output_gallery_differential_analyses.qmd
        - output_gallery_genetic_enrichment.qmd
    - part: "Implementation details"
      chapters:
        - implementation_details_overview.qmd
        - implementation_details.qmd
        - implementation_details_differential_analyses.qmd
        - implementation_details_genetic_enrichment.qmd
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: true
