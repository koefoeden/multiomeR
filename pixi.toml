[environments]
default = []
dev = { features = ["dev"], solve-group = "default" }

[workspace]
name = "multiomeR"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tasks]
refresh-output-gallery = { cmd = "python dev/refresh_output_gallery.py", description = "Refresh the output-gallery previews and manifest from one built aggregation's plots." }
validate-local = { cmd = "Rscript validation/run.R", description = "Check external sources, run the three public validation aggregations, and verify outputs in the existing store." }
test = { cmd = "Rscript tests/testthat.R", description = "Run all reference-parity tests of the reimplemented algorithms." }
install-r-github-packages = { cmd = "Rscript scripts/install_r_github_packages.R", description = "Install GitHub-only R packages into the pixi R library." }
download-demo-data = { cmd = "bash example_data/download_10X_cellranger_count_data.sh example_data/public_immune_human_2x_manifest.tsv", description = "Download the required subsets of two public Cell Ranger ARC outputs." }
setup-demo = { depends-on = ["download-demo-data", "install-r-github-packages"], description = "Prepare the environment and inputs for the public quickstart." }
test-scoring-parity = { cmd = "Rscript -e 'testthat::test_file(\"tests/testthat/test-scoring-parity.R\", stop_on_failure = TRUE)'", description = "Run slow BPCells scoring integration tests against reference implementations." }
test-amulet-parity = { cmd = "Rscript -e 'testthat::test_file(\"tests/testthat/test-amulet-parity.R\", stop_on_failure = TRUE)'", description = "Run slow BPCells-native AMULET integration tests against scDblFinder." }
test-algorithm-validation = { cmd = "Rscript -e 'testthat::test_dir(\"tests/testthat\", filter = \"scoring-parity|wnn-parity|scavenge-parity|amulet-parity\")'", description = "Run slow UCell, WNN, SCAVENGE, and AMULET parity and acceptance tests." }

