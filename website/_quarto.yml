project:
  type: book
  output-dir: ../docs
  resources:
    - parameters.html

book:
  title: "multiomeR Manual"
  site-url: https://koefoeden.github.io/multiomeR/
  repo-url: https://github.com/koefoeden/multiomeR
  repo-subdir: website
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    collapse-level: 2
  chapters:
    - part: "Start here"
      chapters:
        - index.md
    - part: "Output gallery"
      chapters:
        - gallery_main.md
        - gallery_differential_analyses.md
        - gallery_genetic_enrichment.md
    - part: "Try the public demo"
      chapters:
        - demo_installation.md
        - demo_running.md
        - demo_outputs.md
    - part: "Analyze your own data"
      chapters:
        - main_overview.md
        - main_running.md
    - part: "Add an optional analysis"
      chapters:
        - downstream_differential_analyses.md
        - downstream_genetic_enrichment.md
        - downstream_peak_gene_correlation.md
    - part: "Operation and scaling"
      chapters:
        - performance_overview.md
        - performance_distributed_computing.md
        - troubleshooting.md
    - part: "Reference"
      chapters:
        - review_outputs.md
        - reference_GEM_wells.md
        - reference_donor_metadata.md
        - reference_aggregations.md
        - href: implementation/
          text: Implementation book
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: false
