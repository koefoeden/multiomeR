# Build both documentation books with the repository builder and deploy them
# to GitHub Pages. Pull requests rely on the cheap checks in checks.yaml.
name: docs

on:
  push:
    branches: [main]
    paths:
      - website/**
      - dev/render_website.py
      - dev/render_parameter_overview.R
      - dev/check_website_links.py
      - cfg_pipeline_parameters.tsv
      - pixi.toml
      - pixi.lock
      - .github/workflows/docs.yaml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          cache: true

      - name: Render both books
        run: pixi run --use-environment-activation-cache -e dev render-website

      - name: Check rendered internal links
        run: pixi run --use-environment-activation-cache -e dev check-website-links

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
