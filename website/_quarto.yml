project:
  type: book
  output-dir: ../docs

book:
  title: "multiomeR Manual"
  site-url: https://koefoeden.github.io/multiomeR/
  repo-url: https://github.com/koefoeden/multiomeR
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    collapse-level: 2
  chapters:
    - index.qmd
    - part: "Quickstart: Public PBMC demo"
      chapters:
        - installation.qmd
        - running_demo.qmd
    - distributed_computing.qmd
    - part: "Running your own data"
      chapters:
        - inputs_main.qmd
        - running_workflow.qmd
        - implementation_details.qmd 
    - part: "Downstream modules"
      chapters:
        - differential_analyses_walkthrough.qmd
        - genetic_enrichment_walkthrough.qmd
    - output_gallery.qmd
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: true
