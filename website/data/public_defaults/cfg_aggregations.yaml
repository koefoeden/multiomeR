template_aggregation:
  is_active: false
  aggregation_GEM_well_IDs: [my_GEM_well_ID_1, my_GEM_well_ID_2]
  aggregation_donor_id_metadata_tsv: /path/to/donor_metadata.tsv
  aggregation_GEX_marker_genes:
    Cell_type_A: [GENE1, GENE2]
    Cell_type_B: [GENE3, GENE4]

immune_human_2x:
  is_active: true
  aggregation_donor_id_metadata_tsv: configuration/immune_human_dataset_donor_id_metadata.tsv
  aggregation_GEM_well_IDs: [healthy_PBMC_human, controller_PBMC_human]
  aggregation_GEX_marker_genes:
    B: [MS4A1, PAX5, EBF1, CD22]
    Mono: [LYZ, S100A9, FCN1, VCAN]
    NK: [KLRF1, NCR1, NCAM1, SH2D1B]
    DC: [LILRA4, CLEC4C, CD1C, FCER1A, CLEC10A]
    T: [TRAC, CD3D, CD3E, CD3G, BCL11B, THEMIS, CD247, CD2]
    MAIT: [SLC4A10, ZBTB16, KLRB1, NCR3]
  # Effector CD8 and other cytotoxic T cells form their own WNN cluster; the absent KLRF1 keeps NK cells out.
  aggregation_WNN_marker_genes:
    Cytotoxic_T: [CD8A, CD8B, GZMK, GZMH, CCL5, NKG7, KLRF1-]
  modules: null
  aggregation_categorical_vars: [donor_id]
  aggregation_harmony_correction_metadata_col_names: GEM_well_ID
  aggregation_GEX_cluster_annotation_min_advantage: 0.02
  aggregation_ATAC_cluster_annotation_min_advantage: 0.02
  aggregation_WNN_cluster_annotation_min_advantage: 0.02
  # Two donors' 7,800 nuclei hold MAIT and other populations of about 100 nuclei.
  aggregation_cluster_min_barcodes: 50
  aggregation_QC_exclude_list_combined_object: [atac_fragments_in_peaks < 590, atac_fragments_in_peaks_frac < 0.12, atac_fragments_in_blacklist_frac > 0.012]
  aggregation_ATAC_marker_TFs:
    B: [EBF1]
    Mono: [CEBPA, CEBPB]
    NK: [EOMES, TBX21]
    DC: [TCF4]
    T: [TCF7, LEF1]
  aggregation_roadmap_EDACC_names: [Peripheral_Blood_Mononuclear_Primary_Cells, CD4_Memory_Primary_Cells, CD4_Naive_Primary_Cells, CD8_Memory_Primary_Cells, CD8_Naive_Primary_Cells, Monocytes-CD14+_RO01746]

brain_mouse:
  is_active: false
  aggregation_donor_id_metadata_tsv: configuration/brain_mouse_donor_id_metadata.tsv
  aggregation_GEM_well_IDs: [embryonic_brain_mouse]
  # E18 brain holds progenitors and immature neurons but no mature glia, so the
  # marker sets are embryonic; microglia and vascular cells are too few to cluster.
  aggregation_GEX_marker_genes:
    Radial_glia: [Pax6, Slc1a3, Fabp7, Vim, Hes5]
    Intermediate_progenitor: [Eomes, Neurog2, Btg2, Sstr2]
    Upper_layer_neuron: [Satb2, Mef2c, Dok5]
    Deep_layer_neuron: [Fezf2, Tle4, Zfpm2, Sox5, Tbr1]
    Hippocampal_neuron: [Prox1, Nrp2, Grik4, Emx2]
    Inhibitory_neuron: [Gad2, Gad1, Dlx6os1, Dlx1, Dlx5]
  aggregation_QC_exclude_list_combined_object: [atac_fragments_in_peaks < 590, atac_fragments_in_peaks_frac < 0.12, atac_fragments_in_blacklist_frac > 0.012]
  aggregation_ATAC_marker_TFs:
    Radial_glia: [Pax6, Sox2, Hes5, Nfib]
    Intermediate_progenitor: [Eomes, Neurod1]
    Upper_layer_neuron: [Pou3f2, Mef2c, Cux2]
    Deep_layer_neuron: [Tbr1, Fezf2, Bcl11b, Sox5]
    Hippocampal_neuron: [Prox1, Lef1]
    Inhibitory_neuron: [Dlx2, Lhx6]

