r-forcats = ">=1.0.1,<2"
r-fs = ">=1.6.7,<2"
# r-future = ">=1.70.0,<2"
# r-ggforce = ">=0.5.0,<0.6"
r-ggbeeswarm = ">=0.7.3,<0.8"
r-ggplot2 = ">=4.0.2,<5"
r-ggplotify = ">=0.1.3,<0.2"
r-ggpubr = ">=0.6.3,<0.7"
r-ggrastr = ">=1.0.2,<2"
r-ggrepel = ">=0.9.8,<0.10"
r-ggtern = ">=4.0.0,<5"
r-ghql = ">=0.1.2,<0.2"
r-gifski = ">=1.32.0_2,<2"
r-glmmtmb = ">=1.1.14,<2"
r-glue = ">=1.8.0,<2"
r-googlesheets4 = ">=1.1.2,<2"
# r-gprofiler2 = ">=0.2.4,<0.3" # no direct source use
r-gtools = ">=3.9.5,<4"
r-harmony = ">=2.0.2,<3"
r-hdf5r = ">=1.3.12,<2"
r-htmltools = ">=0.5.9,<0.6"
# r-htmlwidgets = ">=1.6.4,<2" # no direct source use; plotly/DT/visNetwork should pull it if needed
r-ieugwasr = ">=1.1.0,<2"
r-igraph = ">=2.1.4,<3"
r-jsonlite = ">=2.0.0,<3"
r-knitr = ">=1.51,<2"
r-lubridate = ">=1.9.5,<2"
r-magrittr = ">=2.0.5,<3"
r-matrix = ">=1.7_4,<2"
r-matrixstats = ">=1.5.0,<2"
r-msigdbr = ">=26.1.0,<27"
