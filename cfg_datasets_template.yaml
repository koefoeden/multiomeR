brain_mouse_dataset:
  dataset_cellranger_arc_refdata_dir: example_data/refdata-cellranger-arc-GRCm39-2024-A
  dataset_QC_exclude_list_per_reaction:
    - TSS.enrichment < 4
    - nucleosome_signal > 4
    - nCount_RNA < 250
    - RNA_mito_percent > 10
  dataset_run_amulet: false

immune_human_dataset:
  dataset_cellranger_arc_refdata_dir: example_data/refdata-cellranger-arc-GRCh38-2024-A
  dataset_QC_exclude_list_per_reaction:
    - TSS.enrichment < 4
    - nucleosome_signal > 4
    - nCount_RNA < 250
    - RNA_mito_percent > 10
  dataset_run_amulet: false

brain_human_dataset:
  inherits: immune_human_dataset
