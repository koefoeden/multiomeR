    modules:
      - genetic_enrichment
    aggregation_GEX_PCA_backend: Seurat_SCT
    aggregation_QC_exclude_list_combined_object:
      - nCount_ATAC < 1000
      - atac_peak_counts_frac < 0.1
      - atac_peak_counts_blacklist_frac > 0.01
    aggregation_ATAC_marker_TFs:
      hepatocyte: [HNF4A__MA1494.2, CEBPA, FOXA1]
      cholangiocyte: [SOX9, HNF1B, GATA6]
      stellate: [PPARG, NR1H3, KLF4]
      kupffer: [SPI1, IRF8, NR1H3]
      endothelial: [ERG, KLF2, GATA2]
    aggregation_ATAC_peak_matrix_mode: overlaps
    aggregation_scDblFinder_GEX_cell_type_collapse_list:
      epithelial: [Hepatocytes, Cholangiocytes]
    aggregation_max_scDblFinder_GEX_score_filter: 0.5
    aggregation_max_scDblFinder_ATAC_score_filter: 0.5
    aggregation_ATAC_data_PCs: !expr 2:13
    aggregation_UMAP_ATAC_PCs: !expr 2:13
    aggregation_GEX_data_PCs: !expr 1:20
    aggregation_UMAP_GEX_PCs: !expr 1:20
    aggregation_UMAP_min_dist: 0.3
    aggregation_GEX_cluster_res: 0.3
    aggregation_ATAC_cluster_res: 0.3
    aggregation_WNN_cluster_res: 0.3
    aggregation_data_nNNs: 50
    aggregation_UMAP_nNNs: 50
    aggregation_harmony_correction_metadata_col_names: [run_harmony, type_biopsy]
    aggregation_categorical_vars:
