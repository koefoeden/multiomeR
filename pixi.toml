[environments]
default = []
dev = { features = ["dev"], solve-group = "default" }

[workspace]
name = "multiomeR"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# we still need some more general cleanup before we do a final dependency hygiene check. Lots of prefix calls in functions/targets that are not used anymore.
# system tools
bcftools = "1.22.*"
htslib = "1.23.*"
bcftools-liftover-plugin = "1.22.*"
macs3 = "3.0.*"
cellsnp-lite = "1.2.*"
vireosnp = "0.5.*"
bedtools = "2.31.*"
ucsc-bedtobigbed = ">=482,<483"
ucsc-bedgraphtobigwig = ">=482,<483"
python-kaleido = ">=1.3.0,<2"
# below are R packages to re-enable while testing the pixi-managed R environment. If updated versions prove problematic, pin the affected packages explicitly.
r-svglite = ">=2.2.2,<3"
bioconductor-annotationhub = ">=4.0.0,<5"
bioconductor-biocparallel = ">=1.44.0,<2"
# bioconductor-biomart = ">=2.66.1,<3" # no direct source use; AnnotationHub/ensembldb are used instead
# bioconductor-biostrings = ">=2.78.0,<3" # no direct source use; BSgenome/TFBSTools should pull it if needed
bioconductor-bsgenome = ">=1.78.0,<2"
"bioconductor-bsgenome.hsapiens.ucsc.hg38" = ">=1.4.5,<2"
"bioconductor-bsgenome.mmusculus.ucsc.mm10" = ">=1.4.3,<2"
"bioconductor-bsgenome.mmusculus.ucsc.mm39" = ">=1.4.3,<2"
bioconductor-cagefightr = ">=1.30.0,<2"
bioconductor-chromvar = ">=1.32.0,<2" # used indirectly by betterChromVAR
# bioconductor-complexheatmap = ">=2.26.1,<3" # no direct source use after replacing genetic enrichment heatmaps with ggplot
# bioconductor-delayedarray = ">=0.36.0,<0.37" # no direct source use; SummarizedExperiment should pull it if needed
bioconductor-edger = ">=4.8.2,<5"
bioconductor-ensembldb = ">=2.34.0,<3"
# bioconductor-genomation = ">=1.42.0,<2" # no direct source use
bioconductor-genomeinfodb = ">=1.46.2,<2"
bioconductor-genomicalignments = ">=1.46.0,<2"
bioconductor-genomicfeatures = ">=1.62.0,<2"
bioconductor-genomicranges = ">=1.62.1,<2"
bioconductor-glmgampoi = ">=1.22.0,<2" # used indirectly by Seurat SCTransform(vst.flavor = "v2")
bioconductor-gviz = ">=1.54.0,<2"
bioconductor-iranges = ">=2.44.0,<3"
bioconductor-jaspar2024 = ">=0.99.7,<0.100"
bioconductor-limma = ">=3.66.0,<4"
bioconductor-matrixgenerics = ">=1.22.0,<2"
bioconductor-milor = ">=2.6.0,<3"
bioconductor-rsamtools = ">=2.26.0,<3"
bioconductor-rtracklayer = ">=1.70.1,<2"
# bioconductor-s4arrays = ">=1.10.1,<2" # no direct source use; SummarizedExperiment/DelayedArray should pull it if needed
bioconductor-s4vectors = ">=0.48.0,<0.49"
bioconductor-scdblfinder = ">=1.24.0,<2"
bioconductor-singlecellexperiment = ">=1.32.0,<2"
bioconductor-summarizedexperiment = ">=1.40.0,<2"
bioconductor-tfbstools = ">=1.48.0,<2"
bioconductor-ucell = ">=2.14.0,<3"
# bioconductor-variantannotation = ">=1.56.0,<2" # no direct source use
r-base = ">=4.5.3,<4.6"
# BPCells is intentionally installed from GitHub into the pixi default/dev R libraries:
# pak::pkg_install("bnprks/BPCells/r")
# The conda/R-universe builds can report the same package version while missing newer
# ATAC export arguments such as write_insertion_bedgraph(normalization_method = "cpm").
# r-bpcells is not available yet for R 4.5.x. PR submitted.
r-assertthat = ">=0.2.1,<0.3"
# r-bedr = ">=1.1.5,<2" # no direct source use after GWAS cleanup
"r-broom.mixed" = ">=0.2.9.7,<0.3"
r-callr = ">=3.7.6,<4"
r-checkmate = ">=2.3.3,<3"
# r-circlize = ">=0.4.18,<0.5" # no direct source use after replacing ComplexHeatmap genetic enrichment plots
r-collapse = ">=2.1.6,<3"
r-coloc = ">=5.2.3,<6"
r-config = ">=0.3.2,<0.4"
r-conflicted = ">=1.2.0,<2"
